    <!-- Critical CSS for instant paint -->
    <style>
      html, body {
        background-color: #0c0c0d !important;
        color: #E2E8F0 !important;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans SC', 'Segoe UI', Roboto, sans-serif;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        box-sizing: border-box;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      #root {
        min-height: 100vh;
        background-color: #0c0c0d;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
      }
      .ai-boot-splash {
        --acs-cyan: #22d3ee;
        --acs-violet: #818cf8;
        --acs-orange: #ff8c00;
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #050508;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans SC', 'Segoe UI', Roboto, sans-serif;
      }
      .ai-boot-splash__grid {
        position: absolute;
        inset: -20%;
        background-image:
          linear-gradient(rgba(34, 211, 238, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(34, 211, 238, 0.06) 1px, transparent 1px);
        background-size: 48px 48px;
        transform: perspective(600px) rotateX(58deg) translateY(-8%);
        animation: ai-boot-grid 18s linear infinite;
        mask-image: radial-gradient(ellipse 70% 55% at 50% 45%, #000 20%, transparent 75%);
      }
      @keyframes ai-boot-grid {
        to { background-position: 0 480px, 480px 0; }
      }
      .ai-boot-splash__scan {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent, rgba(34,211,238,.06) 50%, transparent);
        background-size: 100% 240%;
        animation: ai-boot-scan 3.2s ease-in-out infinite;
      }
      @keyframes ai-boot-scan {
        0%, 100% { background-position: 0 -120%; }
        50% { background-position: 0 120%; }
      }
      .ai-boot-splash__core {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        text-align: center;
      }
      .ai-boot-splash__orb-wrap {
        position: relative;
        width: 112px;
        height: 112px;
      }
      .ai-boot-splash__orb {
        position: absolute;
        inset: 28px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff 0%, var(--acs-cyan) 25%, var(--acs-violet) 70%, #1e1b4b 100%);
        box-shadow: 0 0 24px rgba(34,211,238,.55), 0 0 48px rgba(129,140,248,.35);
        animation: ai-boot-pulse 2.4s ease-in-out infinite;
      }
      @keyframes ai-boot-pulse {
        50% { transform: scale(1.06); }
      }
      .ai-boot-splash__ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1.5px solid transparent;
        animation: ai-boot-spin 2s linear infinite;
      }
      .ai-boot-splash__ring--2 { inset: 10px; border-bottom-color: var(--acs-violet); animation-duration: 2.8s; animation-direction: reverse; }
      .ai-boot-splash__ring--3 { inset: 20px; border-top-color: var(--acs-orange); animation-duration: 3.6s; }
      .ai-boot-splash__ring--1 { border-top-color: var(--acs-cyan); }
      @keyframes ai-boot-spin { to { transform: rotate(360deg); } }
      .ai-boot-splash__brand {
        margin: 0;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 0.12em;
        background: linear-gradient(90deg, #fff, var(--acs-cyan), var(--acs-violet));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .ai-boot-splash__sub {
        margin: -6px 0 0;
        font-size: 11px;
        letter-spacing: 0.35em;
        color: rgba(226,232,240,.45);
      }
      .ai-boot-splash__status {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.08em;
        color: var(--acs-cyan);
        font-family: Consolas, 'SF Mono', monospace;
      }
      .ai-boot-splash__bar {
        width: min(280px, 72vw);
        height: 3px;
        border-radius: 999px;
        background: rgba(255,255,255,.08);
        overflow: hidden;
      }
      .ai-boot-splash__bar-inner {
        height: 100%;
        width: 35%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--acs-violet), var(--acs-cyan), var(--acs-orange));
        animation: ai-boot-bar 2.2s ease-in-out infinite;
      }
      @keyframes ai-boot-bar {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
    </style>

    <title>AICG-创意工作台</title>

    <!-- JSON-LD 结构化数据 -->
    <script type="application/ld+json">

      "@context": "https://schema.org",

      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "CNY"
      },
      "featureList": [
        "AI漫剧生成",
        "AI视频生成",
        "AI图片生成",
        "AI音乐创作",
        "智能配音系统",
        "批量处理引擎"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="ai-boot-splash" aria-label="正在加载小天 AICG">
        <div class="ai-boot-splash__grid"></div>
        <div class="ai-boot-splash__scan"></div>
        <div class="ai-boot-splash__core">

            <span class="ai-boot-splash__ring ai-boot-splash__ring--1"></span>
            <span class="ai-boot-splash__ring ai-boot-splash__ring--2"></span>

          <h1 class="ai-boot-splash__brand">小天 AICG</h1>

        </div>
